
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beancount-tools"
version = "0.1.0"
description = "Reusable utilities and tools for working with Beancount"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beancount>=3.0,<4.0",
    "beangulp==0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
